<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#070710"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#b388ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b388ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- Browser mock -->
  <g transform="translate(220 180)">
    <rect width="1160" height="640" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(24 22)">
      <circle cx="8" cy="8" r="6" fill="#ff6b6b" fill-opacity="0.55"/>
      <circle cx="32" cy="8" r="6" fill="#ffd86b" fill-opacity="0.55"/>
      <circle cx="56" cy="8" r="6" fill="#6bff9c" fill-opacity="0.55"/>
      <rect x="100" y="0" width="380" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    </g>
    <line x1="0" y1="56" x2="1160" y2="56" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Sidebar -->
    <rect x="24" y="80" width="220" height="540" rx="14" fill="#ffffff" fill-opacity="0.025"/>
    <rect x="44" y="108" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="44" y="140" width="180" height="32" rx="8" fill="#7c8cff" fill-opacity="0.18"/>
    <rect x="44" y="184" width="160" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="44" y="216" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="44" y="248" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="44" y="280" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>

    <!-- Stat cards -->
    <g transform="translate(280 96)">
      <rect width="260" height="120" rx="14" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="20" y="20" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
      <text x="20" y="80" font-family="sans-serif" font-size="36" font-weight="700" fill="#ffffff">+24%</text>

      <rect x="284" width="260" height="120" rx="14" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="304" y="20" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
      <text x="304" y="80" font-family="sans-serif" font-size="36" font-weight="700" fill="#7c8cff">1,284</text>

      <rect x="568" width="260" height="120" rx="14" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="588" y="20" width="90" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
      <text x="588" y="80" font-family="sans-serif" font-size="36" font-weight="700" fill="#6ce6ce">97%</text>
    </g>

    <!-- Chart -->
    <g transform="translate(280 240)">
      <rect width="844" height="240" rx="14" fill="#ffffff" fill-opacity="0.03"/>
      <path d="M 30 200 C 100 160, 160 200, 230 150 S 340 60, 430 100 S 560 200, 660 130 S 790 30, 814 60 L 814 220 L 30 220 Z" fill="url(#chart)"/>
      <path d="M 30 200 C 100 160, 160 200, 230 150 S 340 60, 430 100 S 560 200, 660 130 S 790 30, 814 60" fill="none" stroke="#7c8cff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Bottom bars -->
    <g transform="translate(280 500)">
      <rect width="408" height="100" rx="14" fill="#ffffff" fill-opacity="0.03"/>
      <rect x="20" y="22" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
      <rect x="20" y="56" width="368" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="20" y="56" width="265" height="6" rx="3" fill="#b388ff"/>
      <rect x="436" width="408" height="100" rx="14" fill="#ffffff" fill-opacity="0.03"/>
      <rect x="456" y="22" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
      <circle cx="462" cy="62" r="5" fill="#6ce6ce"/>
      <rect x="476" y="56" width="160" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    </g>
  </g>
</svg>
